[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"
anvil = "http://127.0.0.1:8545"

# Explorer verification is configured at broadcast time:
# forge script script/Deploy.s.sol --rpc-url monad_testnet --broadcast \
#   --verify --verifier blockscout --verifier-url <monadscan-api-url> --api-key <key>
# (Key lives in .env locally — never committed. See AGENTS.md rule 6.)
